services:
  weighting-api:
    build: .
    image: survey-weighting-api:latest
    container_name: survey-weighting-api
    ports:
      - "8000:8000"
    environment:
      WEIGHTING_DB_PATH: /data/weighting.db
    volumes:
      - weighting-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  weighting-data:
